# Dagu server config. The image installs it as $DAGU_HOME/config.yaml, where every dagu
# command finds it; the dev compose.yaml mounts it there, so edits apply on restart.
tz: America/Denver

# Dagu hands steps only a few variables by default. These are the ones the steps read.
env_passthrough:
  - OUTLINE_URL
  - OUTLINE_API_KEY
  - MEETINGS_COLLECTION_ID
  - DATA_DIR
  - WHISPER_MODEL
  - RUN_HOURS
  - AGENT
  - AGENT_MODEL
  - AGENT_MAX_TURNS
  - AGENT_BUDGET_SECONDS
  - MENTIONS
  - TRANSCRIBER
  - ASR_CHUNK_SECONDS
  - ASR_CONCURRENCY
  - REVIEW
  - REVIEW_MODEL
  - REVIEW_MAX_SHARE
  - HERMES_HOME
  - HF_HOME
  - VIRTUAL_ENV
env_passthrough_prefixes:
  - TRANSCRIBE_  # transcribe.py's remote-whisper settings
  - LUMEN_       # base url, key, and the agent's, vision and speech models
  - DAGU_        # so poll's `dagu enqueue` finds the same home and DAGs
